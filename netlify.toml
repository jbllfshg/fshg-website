# The site is static HTML. Serverless functions (e.g. the Melbourne Cup
# booking flow) live in netlify/functions and are bundled by Netlify. All
# secrets (Stripe, Airtable, Resend) come from Netlify environment variables,
# never from this repo.
[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Password-protect the staff handbook (and only that page) with an edge
# function. The password lives in the STAFF_HANDBOOK_PASSWORD environment
# variable in Netlify, not in this repo.

[[edge_functions]]
  path = "/staff-handbook"
  function = "staff-handbook-auth"

[[edge_functions]]
  path = "/staff-handbook.html"
  function = "staff-handbook-auth"

[[edge_functions]]
  path = "/staff-handbook/*"
  function = "staff-handbook-auth"

# Turn off the What's On page — redirect it to the home page.
[[redirects]]
  from = "/whats-on"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/whats-on.html"
  to = "/"
  status = 301
  force = true

# Melbourne Cup bookings at The Fairway (Penrith) go straight to NowBookit.
# 302 (temporary) so it can be repointed or removed after the event.
[[redirects]]
  from = "/melbourne-cup-penrith"
  to = "https://bookings.nowbookit.com/?accountid=3893fc92-bf1e-4ecd-900c-f21a423b1180&venueid=9730&theme=light&colors=hex,c5e1a5,558b2f&date=2026-11-03&serviceids=event_QYJN0BI76TI1U_1791771307344"
  status = 302
  force = true

# Block internal files. The site publishes the whole repo (publish = "."),
# so anything that isn't a public page must be hidden here. These return the
# 404 page rather than the file. Note: /.netlify/functions/* (the live
# booking endpoints) is a different path and is NOT affected.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
