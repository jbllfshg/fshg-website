<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — enquiry received | Four Sausages Hospitality Group</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#4a4e69;--tan:#d4a373;--cream:#faedcd;--off-white:#f4f5f0;--ink:#2a2e1e;--ink-mid:#4a4f3a}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
.ty{max-width:560px}
.ty .tick{width:64px;height:64px;border-radius:50%;background:rgba(212,163,115,0.2);color:var(--tan);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.5rem}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);font-weight:600;color:var(--cream);line-height:1.1;margin-bottom:1rem}
p{color:rgba(250,237,205,0.82);font-size:1.02rem;line-height:1.8;font-weight:300;margin-bottom:1.75rem}
.actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
a.btn{background:var(--tan);color:var(--ink);border-radius:4px;padding:14px 28px;font-size:14px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;transition:background 0.2s}
a.btn:hover{background:#c49060}
a.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(250,237,205,0.5)}
a.btn.ghost:hover{background:rgba(250,237,205,0.08)}
</style>
</head>
<body>
  <div class="ty">
    <div class="tick">✓</div>
    <h1>Thank you — your enquiry is in.</h1>
    <p>Our functions team will be in touch very soon. For anything urgent, give us a call and we'll be glad to help.</p>
    <div class="actions">
      <a href="tel:0247023642" class="btn">Call (02) 4702 3642</a>
      <a href="/index.html" class="btn ghost">Back to the site</a>
    </div>
  </div>
</body>
</html>
