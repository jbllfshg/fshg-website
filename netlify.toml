# The site is static HTML. Serverless functions (e.g. the Melbourne Cup
# booking flow) live in netlify/functions and are bundled by Netlify. All
# secrets (Stripe, Airtable, Resend) come from Netlify environment variables,
# never from this repo.
[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Password-protect the staff handbook (and only that page) with an edge
# function. The password lives in the STAFF_HANDBOOK_PASSWORD environment
# variable in Netlify, not in this repo.

[[edge_functions]]
  path = "/staff-handbook"
  function = "staff-handbook-auth"

[[edge_functions]]
  path = "/staff-handbook.html"
  function = "staff-handbook-auth"

# Turn off the What's On page — redirect it to the home page.
[[redirects]]
  from = "/whats-on"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/whats-on.html"
  to = "/"
  status = 301
  force = true
