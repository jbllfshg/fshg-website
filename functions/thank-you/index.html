<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f5f2ec;--paper-2:#efe9dd;--card:#fbfaf6;
  --ink:#211c18;--muted:#7c7267;
  --line:rgba(33,28,24,0.14);--line-strong:rgba(33,28,24,0.24);
  --claret:#8a2b2e;--claret-dk:#6f2124;--orange:#c96a2b;
  --paper-dim:rgba(245,242,236,0.72);--paper-faint:rgba(245,242,236,0.46);
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
img{max-width:100%;display:block}
a{color:inherit}
/* Dark ink band with timber texture; copy sits on a heavy overlay for legibility */
body{font-family:var(--body);color:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;-webkit-font-smoothing:antialiased;background:linear-gradient(rgba(33,28,24,0.88),rgba(33,28,24,0.94)),url('/images/home/texture-timber.webp');background-size:cover;background-position:center;background-color:var(--ink)}
.ty{max-width:580px}
.ty .tick{width:64px;height:64px;border-radius:2px;background:var(--claret);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;margin:0 auto 1.75rem;border-bottom:3px solid var(--orange)}
h1{font-family:var(--display);font-size:clamp(2.2rem,5.6vw,3.4rem);font-weight:900;color:var(--paper);line-height:1;letter-spacing:-0.03em;text-wrap:balance;margin-bottom:1.1rem}
p{color:var(--paper-dim);font-size:1.05rem;line-height:1.7;margin-bottom:2rem}
.actions{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;background:var(--paper);color:var(--ink);border:1px solid transparent;border-radius:2px;padding:14px 28px;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;text-align:center;transition:all 0.18s}
a.btn:hover{background:var(--orange);color:var(--paper)}
a.btn.ghost{background:transparent;color:var(--paper);border-color:rgba(245,242,236,0.4)}
a.btn.ghost:hover{border-color:var(--paper);background:rgba(245,242,236,0.08)}
a.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media(max-width:480px){.actions{flex-direction:column}a.btn{width:100%}}

/* Cohesive photo treatment — consistent warm editorial grade site-wide. */
img,.hero-img{filter:saturate(1.08) contrast(1.05) brightness(1.01) sepia(0.06)}
</style>

<body>
  <div class="ty">
    <div class="tick">✓</div>
    <h1>Thank you — your enquiry is in.</h1>
    <p>Our functions team will be in touch very soon. For anything urgent, give us a call and we'll be glad to help.</p>
    <div class="actions">
      <a href="tel:0247023642" class="btn">Call (02) 4702 3642</a>
      <a href="/index.html" class="btn ghost">Back to the site</a>
    </div>
  </div>
</body>
