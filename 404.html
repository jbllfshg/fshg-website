<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | Four Sausages Hospitality Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#f5f2ec;--ink:#211c18;--muted:#7c7267;--claret:#8a2b2e;--claret-dk:#6f2124;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
body{font-family:var(--body);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;-webkit-font-smoothing:antialiased}
.code{font-family:var(--display);font-size:clamp(64px,14vw,120px);font-weight:900;color:var(--claret);line-height:1}
h1{font-family:var(--display);font-size:clamp(22px,4vw,32px);font-weight:800;text-transform:uppercase;margin:1rem 0 .75rem}
p{color:var(--muted);font-size:16px;margin-bottom:2rem}
a{display:inline-block;text-decoration:none;background:var(--claret);color:var(--paper);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:13px 26px;border-radius:2px}
a:hover{background:var(--claret-dk)}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>Sorry, we couldn't find the page you were looking for.</p>
  <a href="/">Back to home</a>
</main>
</body>
</html>
